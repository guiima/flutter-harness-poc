name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter-ci:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ── Sensor 1: Lint (determinístico) ──────────────────────────────
      - name: Analyze
        run: flutter analyze

      # ── Sensor 2: Testes + Coverage (determinístico) ──────────────────
      - name: Test with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Check coverage threshold (min 80%)
        run: |
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)' | head -1)
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ Coverage $COVERAGE% is below the 80% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets the 80% threshold"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

      # ── Sensor 3: Security — secrets hardcoded (determinístico) ──────
      # base/head omitted: TruffleHog auto-detects from event context
      # (push → before..after, pull_request → PR diff). Avoids BASE==HEAD
      # error that occurs when a squash-merge commit lands on main.
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # ── Sensor 4: Staleness — dependências desatualizadas ───────────────
      - name: Check for outdated dependencies
        run: |
          echo "Verificando dependências desatualizadas..."
          OUTDATED=$(flutter pub outdated --no-color 2>&1)
          echo "$OUTDATED"
          if echo "$OUTDATED" | grep -qE "^\*"; then
            echo "❌ Existem dependências com major updates disponíveis — atualize ou registre decisão em DECISIONS.md"
            exit 1
          fi
          echo "✅ Todas as dependências estão na versão mais recente compatível"

      # ── Sensor 5: Architecture Fitness (determinístico) ───────────────
      - name: Architecture fitness — widgets must not import services
        run: |
          echo "Verificando que widgets não importam services diretamente..."
          if grep -r "import.*services" lib/widgets/ 2>/dev/null; then
            echo "❌ Violação: widget importa service diretamente (viola core-beliefs.md)"
            exit 1
          fi
          if grep -r "import.*services" lib/screens/ 2>/dev/null; then
            echo "⚠️  Screen importa service — aceitável apenas via construtor"
          fi
          echo "✅ Architecture fitness check passou"

      - name: Architecture fitness — models must be immutable
        run: |
          echo "Verificando imutabilidade dos models..."
          if grep -rn "set " lib/models/ 2>/dev/null | grep -v "//"; then
            echo "❌ Violação: model com setter encontrado (viola core-beliefs.md)"
            exit 1
          fi
          echo "✅ Models são imutáveis"

      # ── Sensor 6: Inline-disable proibido (core-beliefs #7) ─────────
      - name: Check for inline lint suppressions
        run: |
          echo "Verificando comentários // ignore: em lib/..."
          if grep -rn "// ignore:" lib/ 2>/dev/null; then
            echo "❌ Violação: uso de // ignore: encontrado (viola core-beliefs.md)"
            exit 1
          fi
          if grep -rn "// ignore_for_file:" lib/ 2>/dev/null; then
            echo "❌ Violação: uso de // ignore_for_file: encontrado (viola core-beliefs.md)"
            exit 1
          fi
          echo "✅ Nenhuma supressão de lint encontrada"

      # ── Sensor 7: Duplicação de código (DRY) ─────────────────────────
      - name: Check for duplicate code
        run: |
          npm install -g jscpd --silent
          jscpd lib \
            --min-lines 6 \
            --min-tokens 50 \
            --threshold 5 \
            --reporters console \
            --ignore "**/*.g.dart"
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Duplicação de código acima de 5% detectada (viola core-beliefs.md)"
            exit 1
          fi
          echo "✅ Nível de duplicação dentro do limite"
